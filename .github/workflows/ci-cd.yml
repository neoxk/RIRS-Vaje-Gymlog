name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Namestitev odvisnosti (backend)
        working-directory: backend
        run: npm ci

      - name: Namestitev odvisnosti (frontend)
        working-directory: frontend
        run: npm ci

      - name: ESLint (backend)
        working-directory: backend
        run: npm run lint

      - name: ESLint (frontend)
        working-directory: frontend
        run: npm run lint
